<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; background: black; height: 100%; overflow: hidden; }
  #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #instagram-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; background: black; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="player"></div>
<div id="instagram-container" style="display:none;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Reads platform + either (videoId/start) for YouTube, or a Supabase
  // row id for Instagram, from this page's own URL query params. This is
  // a genuinely static file, which is why GitHub Pages (unlike Supabase
  // Edge Functions, which don't support serving HTML at all) can serve it
  // correctly as real, renderable HTML.
  const params = new URLSearchParams(window.location.search);
  const platform = params.get('platform') || 'youtube';
  let ytPlayer = null;

  if (platform === 'instagram') {
    loadInstagram(params.get('rowId'));
  }
  // YouTube loads itself via onYouTubeIframeAPIReady below, once the
  // IFrame API script has finished loading.

  function onYouTubeIframeAPIReady() {
    if (platform !== 'youtube') return;
    const videoId = params.get('videoId') || '';
    const start = parseInt(params.get('start') || '0', 10);

    ytPlayer = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        start: start,
        controls: 0,
        modestbranding: 1,
        playsinline: 1,
        rel: 0,
        mute: 1
      }
    });
  }

  // Using the real IFrame API (rather than reloading the iframe's src
  // with a new mute= parameter) means play/pause/mute can all be called
  // directly on the existing player without ever reloading it — which
  // avoids restarting the video and avoids losing the "this was a direct
  // user tap" context iOS requires to actually allow unmuted audio.
  function playSample() {
    if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
  }
  function pauseSample() {
    if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
  }
  function muteSample() {
    if (ytPlayer && ytPlayer.mute) ytPlayer.mute();
  }
  function unmuteSample() {
    if (ytPlayer && ytPlayer.unMute) ytPlayer.unMute();
  }

  // Fetches the embed_html for one row directly from Supabase using just
  // the row's id — avoids ever needing to pass Instagram's full embed
  // snippet (which includes quotes and a script tag) through a URL.
  async function loadInstagram(rowId) {
    const SUPABASE_URL = "https://efidvkbdbdddfldkjois.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaWR2a2JkYmRkZGZsZGtqb2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzU3OTYsImV4cCI6MjEwMDI1MTc5Nn0.q8x2-rN8Cl31dFIwOhs4P0kX1GTvj_Zen7t8w5x8sTs";

    document.getElementById('player').style.display = 'none';
    const instaContainer = document.getElementById('instagram-container');
    instaContainer.style.display = 'flex';

    try {
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/creator_videos?id=eq.' + rowId + '&select=embed_html',
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } }
      );
      const rows = await res.json();
      const embedHtml = rows && rows[0] && rows[0].embed_html;
      if (!embedHtml) {
        instaContainer.innerHTML = '<p style="color:white;font-family:sans-serif;">Couldn\'t load this post.</p>';
        return;
      }

      // Injecting via innerHTML alone does not execute the <script> tag
      // Instagram's embed HTML includes (browsers don't run scripts added
      // this way) — so the blockquote markup and the script are inserted
      // separately, with the script recreated as a real element so it
      // actually runs and converts the blockquote into the live embed.
      instaContainer.innerHTML = embedHtml;
      const oldScript = instaContainer.querySelector('script');
      if (oldScript) {
        const newScript = document.createElement('script');
        newScript.async = true;
        newScript.src = oldScript.src || 'https://www.instagram.com/embed.js';
        oldScript.remove();
        document.body.appendChild(newScript);
      }
    } catch (e) {
      instaContainer.innerHTML = '<p style="color:white;font-family:sans-serif;">Couldn\'t load this post.</p>';
    }
  }
</script>
</body>
</html>
