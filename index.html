<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; background: black; height: 100%; overflow: hidden; }
  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="player"
  allow="autoplay; encrypted-media"
  allowfullscreen
></iframe>
<script>
  // Reads videoId/start/duration from this page's own URL query params
  // (e.g. ?videoId=XXXX&start=5&duration=40), rather than needing any
  // server-side logic — this is a genuinely static HTML file, which is
  // why GitHub Pages (unlike Supabase Edge Functions) can serve it
  // correctly as real, renderable HTML.
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get('videoId') || '';
  const start = params.get('start') || '0';

  document.getElementById('player').src =
    'https://www.youtube-nocookie.com/embed/' + videoId +
    '?start=' + start +
    '&autoplay=1&mute=1&controls=0&playsinline=1&rel=0';
</script>
</body>
</html>
