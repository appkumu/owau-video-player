<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; background: black; height: 100%; overflow: hidden; }
  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="tiktok-container"></div>

<script>
  // Reads a TikTok post id from this page's own URL query params
  // (?postId=...). This is a genuinely static file, which is why GitHub
  // Pages (unlike Supabase Edge Functions, which don't support serving
  // HTML at all) can serve it correctly as real, renderable HTML.
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('postId') || '';

  const container = document.getElementById('tiktok-container');
  container.innerHTML =
    '<iframe id="tt-player" allow="autoplay; fullscreen" src="' +
    'https://www.tiktok.com/player/v1/' + postId +
    '?controls=0&autoplay=1&muted=1&loop=1&rel=0&native_context_menu=0' +
    '"></iframe>';

  // TikTok's official embed player is controlled via window.postMessage
  // to the iframe's contentWindow, per their documented API — not a
  // global JS object the way YouTube's IFrame API works. Each message
  // must include "x-tiktok-player": true to be recognized.
  //
  // The outer page loading doesn't guarantee the nested TikTok iframe has
  // finished initializing its own message listener yet — sending once
  // right away can silently miss that window, causing intermittent
  // failures depending on exact timing. Retrying a few times with short
  // delays gives it multiple chances to land — but retrying blindly for
  // a full second made mute/unmute feel laggy even once it landed early,
  // so retries now stop as soon as the player itself confirms the mute
  // state actually changed (via its onMute message).
  let currentMuted = true;
  let muteRetryTimer = null;

  function sendMuteState(muted) {
    currentMuted = muted;
    if (muteRetryTimer) clearTimeout(muteRetryTimer);
    let attempts = 0;
    const trySend = () => {
      const iframe = document.getElementById('tt-player');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage(
          { type: muted ? 'mute' : 'unMute', value: undefined, 'x-tiktok-player': true }, '*'
        );
      }
      attempts++;
      if (attempts < 5) muteRetryTimer = setTimeout(trySend, 100);
    };
    trySend();
  }

  function sendToTikTok(type, value) {
    const iframe = document.getElementById('tt-player');
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage({ type: type, value: value, 'x-tiktok-player': true }, '*');
  }

  function playSample() { sendToTikTok('play'); }
  function pauseSample() { sendToTikTok('pause'); }
  function muteSample() { sendMuteState(true); }
  function unmuteSample() { sendMuteState(false); }

  // Player-to-host messages, per TikTok's documented events. onMute
  // confirms our command actually landed, so retries can stop right away
  // instead of continuing to fire for up to a second. onStateChange firing
  // with value 1 ("playing") happens on every loop restart too — the
  // player appears to reset toward its own default briefly at that point,
  // which is why it very briefly unmutes on loop; re-sending the current
  // mute state at that exact moment corrects it immediately.
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || !data['x-tiktok-player']) return;
    if (data.type === 'onMute' && muteRetryTimer) {
      clearTimeout(muteRetryTimer);
      muteRetryTimer = null;
    }
    if (data.type === 'onStateChange' && data.value === 1) {
      sendMuteState(currentMuted);
    }
  });
</script>
</body>
</html>
